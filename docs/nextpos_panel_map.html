function renderPanel(p){
document.getElementById('h-title').textContent=p.name;
document.getElementById('h-path').textContent=p.url;
document.getElementById('h-roles').innerHTML=p.roles.map(r=>`<span class="role-badge ${r.c}">${r.l}</span>`).join('');

const cf=document.getElementById('col-features');
cf.innerHTML='<div class="col-title">Özellikler</div>';
p.features.forEach(f=>{
cf.innerHTML+=`<div class="feature-item"><div class="feature-dot" style="background:${f.c}"></div><div class="feature-text">${f.t}</div></div>`;
});

const cr=document.getElementById('col-rel');
cr.innerHTML='<div class="col-title">Panel İlişkileri</div>';
p.rels.forEach(r=>{
cr.innerHTML+=`<div class="rel-item"><div class="rel-arrow">${r.a}</div><div class="rel-text">${r.t}</div></div>`;
});

const ci=document.getElementById('col-imp');
ci.innerHTML='<div class="col-title">İyileştirme Önerileri</div>';
p.imps.forEach(i=>{
ci.innerHTML+=`<div class="imp-item"><span class="imp-prio ${i.pc}">${i.p}</span><div class="imp-text">${i.t}</div></div>`;
});
}

const sidebar=document.querySelector('.sidebar');
panels.forEach((p,idx)=>{
const btn=document.createElement('button');
btn.className='panel-btn'+(idx===0?' active':'');
btn.dataset.id=p.id;
btn.innerHTML=`<div class="panel-icon" style="background:${p.color}22;color:${p.color}">${p.icon}</div><div><div class="panel-name">${p.name}</div><div class="panel-url">${p.url.split('/')[1]||p.url}</div></div>`;
btn.onclick=()=>{
document.querySelectorAll('.panel-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderPanel(p);
};
sidebar.appendChild(btn);
});

renderPanel(panels[0]);
</script>
